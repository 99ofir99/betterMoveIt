<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".55" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ff4a62"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".2" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#fffaf6"/>
      <stop offset="1" stop-color="#ffe9de"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- route: start ring + dotted curve into the character -->
  <path d="M118 400 C 168 400, 168 344, 196 326" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 30" opacity=".9"/>
  <circle cx="118" cy="400" r="22" fill="#fff"/>
  <circle cx="118" cy="400" r="9" fill="#ff6a4d"/>

  <!-- speed trails -->
  <rect x="84" y="186" width="74" height="16" rx="8" fill="url(#trail)"/>
  <rect x="64" y="228" width="92" height="16" rx="8" fill="url(#trail)"/>
  <rect x="92" y="270" width="62" height="16" rx="8" fill="url(#trail)"/>

  <!-- soft ground shadow -->
  <ellipse cx="290" cy="392" rx="84" ry="16" fill="#9e1f33" opacity=".28" filter="url(#soft)"/>

  <!-- character -->
  <circle cx="290" cy="234" r="128" fill="url(#ball)"/>
  <ellipse cx="236" cy="168" rx="34" ry="18" fill="#fff" opacity=".9" transform="rotate(-28 236 168)"/>

  <!-- face -->
  <ellipse cx="252" cy="222" rx="15" ry="19" fill="#262a35"/>
  <ellipse cx="328" cy="222" rx="15" ry="19" fill="#262a35"/>
  <circle cx="257" cy="214" r="5.5" fill="#fff"/>
  <circle cx="333" cy="214" r="5.5" fill="#fff"/>
  <path d="M252 262 Q290 298 328 262" fill="none" stroke="#262a35" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="222" cy="262" rx="15" ry="10" fill="#ff8f86" opacity=".5"/>
  <ellipse cx="358" cy="262" rx="15" ry="10" fill="#ff8f86" opacity=".5"/>
</svg>
