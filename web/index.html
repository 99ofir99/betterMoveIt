<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Ad-free multimodal transit with every feature unlocked." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>BetterMoovit</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force-drop stale production SW when testing over ngrok / tunnels.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
        // Trigger update of any still-registered worker (kill-switch at /sw.js in Vite).
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
